name: Static checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js
      - name: JSON validity
        run: |
          python3 -m json.tool zones.json > /dev/null
          python3 -m json.tool manifest.json > /dev/null
      - name: No duplicate element IDs
        run: |
          python3 - << 'PY'
          import re, sys
          ids = re.findall(r'id="([^"]+)"', open('index.html', encoding='utf-8').read())
          dup = sorted({i for i in ids if ids.count(i) > 1})
          if dup:
              print("Duplicate IDs:", dup); sys.exit(1)
          print("IDs OK:", len(ids))
          PY
      - name: Version consistency (footer vs assets vs SW)
        run: |
          python3 - << 'PY'
          import re, sys
          html = open('index.html', encoding='utf-8').read()
          sw = open('sw.js', encoding='utf-8').read()
          foot = re.search(r'TLC Pro · v(\d+)\.(\d+)', html)
          asset = re.search(r'app\.js\?v=(\d+)', html)
          cache = re.search(r'tlc-pro-v(\d+)', sw)
          ok = foot and asset and cache and asset.group(1) in sw and f"?v={asset.group(1)}" in sw
          print("footer", foot.group(0) if foot else None, "| asset", asset.group(1) if asset else None, "| cache", cache.group(1) if cache else None)
          sys.exit(0 if ok else 1)
          PY
